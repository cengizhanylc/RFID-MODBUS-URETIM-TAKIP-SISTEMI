[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1 ; Zero ve Super Mini klonları için temel DevKitC tanımı mükemmel çalışır.
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1

; ESP32-S3-Zero için 4MB Flash ayarları
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv ; 4MB'a uygun standart bölümleme

build_flags =
  -D CORE_DEBUG_LEVEL=1
  -Og
  ; Native USB üzerinden Seri Portu aktif etmek için şart olan bayraklar:
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Kartında PSRAM varsa (Genelde 2MB dahili olarak bulunur) aktif eder:
  ; ESP32-S3-Zero'da genellikle PSRAM yoktur, bu yüzden kapalı tutulmalıdır:
  ; -D BOARD_HAS_PSRAM 

monitor_filters = 
  default
  esp32_exception_decoder

lib_deps =
  ; ESP32-S3 için en uyumlu AsyncTCP
  esphome/AsyncTCP-esphome @ ^2.1.4
  ; ESPAsyncWebServer'ın en güncel ve uyumlu hali
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  
  ; Diğer kütüphaneleriniz
  emelianov/modbus-esp8266 @ ^4.1.0
  adafruit/Adafruit PN532 @ ^1.3.3
  bblanchon/ArduinoJson @ ^7.0.4