[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1

; Flash ayarları (N16R8 için en kararlı mod)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Og ; Bu bayrak, optimize edilmiş ama hata ayıklama sembolleri korunan bir derleme yapar.

monitor_filters = 
  default
  esp32_exception_decoder

lib_deps =
  ; ESP32-S3 için en uyumlu AsyncTCP
  esphome/AsyncTCP-esphome @ ^2.1.4
  ; ESPAsyncWebServer'ın en güncel ve uyumlu hali
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  
  ; Diğer kütüphaneleriniz
  emelianov/modbus-esp8266 @ ^4.1.0
  adafruit/Adafruit PN532 @ ^1.3.3
  bblanchon/ArduinoJson @ ^7.0.4